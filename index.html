<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Следопыт</title>
  <style>
    :root { --bg:#12160f; --card:#232b1f; --line:#3a4634; --t:#e8eddf; --m:#9aa58d; --a:#c9a227; }
    * { box-sizing: border-box; }
    html, body { margin:0; background:var(--bg); color:var(--t); font-family:system-ui,sans-serif; }
    .top { padding:12px 14px; display:flex; justify-content:space-between; gap:8px; align-items:center; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:18px; }
    .sub { margin:2px 0 0; color:var(--m); font-size:12px; }
    .btn { background:var(--a); color:#1a1406; border:0; border-radius:12px; padding:12px 14px; font-weight:800; font-size:16px; }
    .tools { display:flex; flex-wrap:wrap; gap:8px; padding:10px 12px; }
    .tool { flex:1; min-width:30%; min-height:48px; background:#2a3326; border:1px solid var(--line); color:var(--t); border-radius:12px; font-weight:700; }
    .tool.on { background:var(--a); color:#1a1406; }
    .stage { margin:0 12px; height:46vh; min-height:240px; background:#0d100c; border:1px solid var(--line); border-radius:14px; position:relative; overflow:hidden; }
    canvas { width:100%; height:100%; display:block; touch-action:none; }
    .ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--m); padding:16px; pointer-events:none; }
    .box { margin:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
    .dir { font-size:42px; font-weight:800; line-height:1; margin:6px 0; }
    .err { color:#ff8a8a; }
    .ok { color:#7dce7a; }
  </style>
</head>
<body>
  <div class="top">
    <div>
      <h1>Следопыт</h1>
      <div class="sub" id="st">Выберите фото следа</div>
    </div>
    <label class="btn">Фото
      <input id="file" type="file" accept="image/*,image/jpeg,image/png,.jpg,.jpeg,.png,.webp" hidden />
    </label>
  </div>
  <div class="tools">
    <button class="tool on" data-t="heel">1 Каблук</button>
    <button class="tool" data-t="toe">2 Носок</button>
    <button class="tool" data-t="next">3 След 2</button>
    <button class="tool" id="clr">Сброс</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="ph" id="ph">Нажмите «Фото», затем тыкните каблук и носок</div>
  </div>
  <div class="box" id="out">Ждёт фото.</div>
<script>
(function () {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const stage = document.getElementById("stage");
  const out = document.getElementById("out");
  const stEl = document.getElementById("st");
  const ph = document.getElementById("ph");
  const file = document.getElementById("file");
  const rumbaNames = ["С","ССВ","СВ","ВСВ","В","ВЮВ","ЮВ","ЮЮВ","Ю","ЮЮЗ","ЮЗ","ЗЮЗ","З","ЗСЗ","СЗ","ССЗ"];
  const S = { img: null, tool: "heel", marks: {}, s: 1, ox: 0, oy: 0 };
  function rumba(d) { return rumbaNames[Math.round((((d % 360) + 360) % 360) / 22.5) % 16]; }
  function norm(d) { d = ((d % 360) + 360) % 360; return d; }
  function heading(a, b) {
    let d = Math.atan2(b.x - a.x, -(b.y - a.y)) * 180 / Math.PI;
    return d < 0 ? d + 360 : d;
  }
  function ang(a, b) { let d = Math.abs(norm(a) - norm(b)); return d > 180 ? 360 - d : d; }
  function setStatus(t) { stEl.textContent = t; }
  function resize() {
    const r = stage.getBoundingClientRect();
    const p = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.max(1, r.width * p);
    canvas.height = Math.max(1, r.height * p);
    canvas.style.width = r.width + "px";
    canvas.style.height = r.height + "px";
    if (S.img) fit();
    draw();
  }
  function fit() {
    if (!S.img) return;
    const r = stage.getBoundingClientRect();
    S.s = Math.min(r.width / S.img.width, r.height / S.img.height) * 0.98;
    S.ox = (r.width - S.img.width * S.s) / 2;
    S.oy = (r.height - S.img.height * S.s) / 2;
  }
  function toView(p) { return { x: S.ox + p.x * S.s, y: S.oy + p.y * S.s }; }
  function toImg(x, y) { return { x: (x - S.ox) / S.s, y: (y - S.oy) / S.s }; }
  function draw() {
    const r = stage.getBoundingClientRect();
    const p = Math.min(2, window.devicePixelRatio || 1);
    ctx.setTransform(p, 0, 0, p, 0, 0);
    ctx.clearRect(0, 0, r.width, r.height);
    if (!S.img) return;
    ctx.drawImage(S.img, S.ox, S.oy, S.img.width * S.s, S.img.height * S.s);
    const m = S.marks;
    if (m.heel && m.toe) {
      const h = toView(m.heel), t = toView(m.toe);
      ctx.strokeStyle = "#6ec4ff"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(h.x, h.y); ctx.lineTo(t.x, t.y); ctx.stroke();
    }
    [["heel","#e8c36a","каблук"],["toe","#6ec4ff","носок"],["next","#b08cff","след 2"]].forEach(function (row) {
      if (!m[row[0]]) return;
      const v = toView(m[row[0]]);
      ctx.fillStyle = row[1];
      ctx.beginPath(); ctx.arc(v.x, v.y, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "13px sans-serif";
      ctx.fillText(row[2], v.x + 12, v.y - 8);
    });
  }
  function analyze() {
    const m = S.marks;
    if (!S.img) { out.textContent = "Сначала загрузите фото."; return; }
    if (!m.heel || !m.toe) { out.innerHTML = "Поставьте <b>каблук</b> и <b>носок</b>."; return; }
    const face = heading(m.heel, m.toe);
    let gait = "unknown", travel = face;
    if (m.next) {
      const mid = { x: (m.heel.x + m.toe.x) / 2, y: (m.heel.y + m.toe.y) / 2 };
      const g = ang(heading(mid, m.next), face);
      if (g < 70) gait = "forward";
      else if (g > 110) { gait = "backward"; travel = norm(face + 180); }
    }
    const mode = gait === "backward" ? "ЗАДОМ" : gait === "forward" ? "ВПЕРЁД" : "режим неясен — нужен след 2";
    out.innerHTML = "<div>КУДА ШЁЛ</div><div class='dir'>" + rumba(travel) + "</div><div>" + Math.round(travel) + "° · " + mode + "</div><p>Носок / лицо: " + rumba(face) + " (" + Math.round(face) + "°).</p>";
    setStatus("Разбор готов");
  }
  function loadFromFile(f) {
    if (!f) return;
    setStatus("Читаю: " + f.name);
    const reader = new FileReader();
    reader.onload = function () {
      const im = new Image();
      im.onload = function () {
        S.img = im; S.marks = {}; ph.style.display = "none"; fit(); draw(); analyze();
        setStatus("Фото загружено. Тапните каблук.");
      };
      im.onerror = function () {
        out.innerHTML = "<span class='err'>Сохраните снимок как JPEG и загрузите JPG.</span>";
        setStatus("Ошибка загрузки");
      };
      im.src = reader.result;
    };
    reader.readAsDataURL(f);
  }
  file.addEventListener("change", function () { loadFromFile(file.files && file.files[0]); });
  document.querySelectorAll(".tool[data-t]").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll(".tool[data-t]").forEach(function (x) { x.classList.remove("on"); });
      b.classList.add("on"); S.tool = b.getAttribute("data-t");
    });
  });
  document.getElementById("clr").addEventListener("click", function () { S.marks = {}; analyze(); draw(); });
  canvas.addEventListener("pointerdown", function (ev) {
    if (!S.img) { setStatus("Сначала фото"); return; }
    const r = canvas.getBoundingClientRect();
    S.marks[S.tool] = toImg(ev.clientX - r.left, ev.clientY - r.top);
    if (S.tool === "heel") {
      S.tool = "toe";
      document.querySelectorAll(".tool[data-t]").forEach(function (x) { x.classList.toggle("on", x.getAttribute("data-t") === "toe"); });
      setStatus("Теперь носок");
    } else if (S.tool === "toe" && !S.marks.next) {
      S.tool = "next";
      document.querySelectorAll(".tool[data-t]").forEach(function (x) { x.classList.toggle("on", x.getAttribute("data-t") === "next"); });
      setStatus("Теперь след 2");
    }
    analyze(); draw();
  });
  window.addEventListener("resize", resize);
  resize();
})();
</script>
</body>
</html>
